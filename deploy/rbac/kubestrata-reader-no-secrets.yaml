# kubestrata-reader-no-secrets: read-only access for `kubestrata collect --no-secrets`, without
# any access to Secrets.
#
# RBAC cannot grant "everything but Secrets", so the kinds are listed: the core kinds kubestrata
# reads, the built-in API groups of its inventory, the API groups whose custom resources it reads
# with dedicated facts or that OpenShift and common delivery tools serve, and the
# CustomResourceDefinitions (discovery of custom resources). Add the API groups of your own custom
# resources to the last rule; a kind this role does not cover is reported in the snapshot errors as
# Forbidden and collection continues, or leave it out with --skip-kinds.
#
# What --no-secrets loses: the Helm release state (helm.sh/release.v1 Secrets: release, revision,
# status) and the links from workloads, Ingresses and Gateways to Secrets (mounts, env-from,
# pull-secret, tls). Helm is still detected from the labels and annotations of the objects.
#
# Only list (and get on the kube-system Namespace, the cluster identity): no watch, no write verb,
# no subresource.
#
# Use (README, "Permissions"):
#   kubectl apply -f deploy/rbac/kubestrata-reader-no-secrets.yaml
#   kubectl create token kubestrata-reader-no-secrets -n kubestrata --duration=1h
#   kubectl delete -f deploy/rbac/kubestrata-reader-no-secrets.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kubestrata
  labels:
    app.kubernetes.io/name: kubestrata
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubestrata-reader-no-secrets
  namespace: kubestrata
  labels:
    app.kubernetes.io/name: kubestrata
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubestrata-reader-no-secrets
  labels:
    app.kubernetes.io/name: kubestrata
rules:
  # core kinds of the inventory; secrets are not in the list
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - replicationcontrollers
      - services
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - limitranges
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
  # built-in API groups of the inventory
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list"]
  # custom resources: OpenShift, Gateway API, volume snapshots, OLM, Prometheus Operator, Argo CD,
  # Flux, cert-manager, Karpenter and EKS Auto Mode. Add your own API groups here.
  - apiGroups:
      - route.openshift.io
      - apps.openshift.io
      - image.openshift.io
      - build.openshift.io
      - template.openshift.io
      - quota.openshift.io
      - security.openshift.io
      - config.openshift.io
      - operator.openshift.io
      - machine.openshift.io
      - machineconfiguration.openshift.io
      - apiserver.openshift.io
      - console.openshift.io
      - operators.coreos.com
      - monitoring.coreos.com
      - gateway.networking.k8s.io
      - snapshot.storage.k8s.io
      - argoproj.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - cert-manager.io
      - karpenter.sh
      - karpenter.k8s.aws
      - eks.amazonaws.com
    resources: ["*"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubestrata-reader-no-secrets
  labels:
    app.kubernetes.io/name: kubestrata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubestrata-reader-no-secrets
subjects:
  - kind: ServiceAccount
    name: kubestrata-reader-no-secrets
    namespace: kubestrata
