name: security

# - govulncheck: known vulnerabilities (Go vulnerability database) in the standard library and the
#   modules, failing when the code reaches one. Runs on every change and weekly, because new
#   advisories land without any change here (a toolchain bump in go.mod fixes the stdlib ones).
# - zizmor: security audit of the GitHub Actions workflows (permissions, triggers, injection).
# CodeQL, Dependabot alerts and secret scanning run from the repository settings.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -show verbose ./...

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships with the GitHub-hosted Ubuntu images.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.33.1 --format github .github/workflows
