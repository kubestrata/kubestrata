name: lab

# End to end on a real lab: installs kuberito (https://github.com/kuberito/kuberito) from its
# release, brings up both clusters with the full profile, then runs `make lab-test` (collection
# against the lab's ground truth, compare, no leak) and `make page-check` (render and compare
# pages in headless Chrome, which the ubuntu-24.04 image ships).
#
# Skipped until the repository variable KUBERITO_PUBLIC is "true": kuberito must be public and
# KUBERITO_VERSION released (signed) before this job can install it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    if: vars.KUBERITO_PUBLIC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The kuberito release the lab comes from: archive checked against checksums.txt, whose
      # keyless signature must come from kuberito's release workflow at this tag.
      KUBERITO_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.4

      - id: kuberito
        name: install kuberito (checksum + cosign)
        run: |
          set -eu
          dir="$RUNNER_TEMP/kuberito"
          mkdir -p "$dir" && cd "$dir"
          file="kuberito_${KUBERITO_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/kuberito/kuberito/releases/download/v${KUBERITO_VERSION}"
          for f in checksums.txt checksums.txt.sigstore.json "$file"; do
            curl -fsSLO "${base}/${f}"
          done
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/kuberito/kuberito/.github/workflows/release.yml@refs/tags/v${KUBERITO_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" kuberito
          ./kuberito --version
          echo "bin=$dir/kuberito" >> "$GITHUB_OUTPUT"

      - name: kuberito up --profile full
        env:
          KUBERITO: ${{ steps.kuberito.outputs.bin }}
        run: |
          "$KUBERITO" up --profile full
          "$KUBERITO" status

      # The e2e reads ~/.kuberito (truth files and kubeconfig); KUBECONFIG keeps every client off
      # any other kubeconfig.
      - name: make lab-test
        run: |
          export KUBECONFIG="$HOME/.kuberito/kubeconfig"
          make lab-test

      - name: make page-check
        env:
          PAGE_CHECK_SOURCE: kuberito-source
          PAGE_CHECK_TARGET: kuberito-target
        run: |
          set -eu
          export KUBECONFIG="$HOME/.kuberito/kubeconfig"
          KUBESTRATA_CACHE_DIR="$(mktemp -d)"
          export KUBESTRATA_CACHE_DIR
          make build
          bin/kubestrata collect -c kuberito-source -c kuberito-target --force
          make page-check

      - name: kuberito down
        if: always() && steps.kuberito.outputs.bin != ''
        env:
          KUBERITO: ${{ steps.kuberito.outputs.bin }}
        run: '"$KUBERITO" down --yes || true'
