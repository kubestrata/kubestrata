name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signature (Sigstore, GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "unexpected tag $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          mtime="$(git log -1 --format=%cI)"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            work="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X main.version=${version}" -o "$work/kubestrata" ./cmd/kubestrata
            cp LICENSE README.md "$work/"
            tar --sort=name --mtime="$mtime" --owner=0 --group=0 --numeric-owner \
              -C "$work" -czf "dist/kubestrata_${version}_${os}_${arch}.tar.gz" kubestrata LICENSE README.md
          done
          (cd dist && sha256sum kubestrata_*.tar.gz > checksums.txt && cat checksums.txt)

      - name: smoke (linux/amd64 archive)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          work="$(mktemp -d)"
          tar -xzf "dist/kubestrata_${version}_linux_amd64.tar.gz" -C "$work" kubestrata
          sh scripts/smoke-check.sh "$work/kubestrata" "$version"

      - name: sign checksums (cosign keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086 # $pre is empty or one flag
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" $pre --notes-file - <<'EOF'
          Binaries for darwin/linux on arm64/amd64. Install with `brew install kubestrata/tap/kubestrata`,
          `uv tool install kubestrata` (or `uvx kubestrata`, `pipx install kubestrata`) or
          `go install github.com/kubestrata/kubestrata/cmd/kubestrata@latest`. Changes: see
          [CHANGELOG.md](https://github.com/kubestrata/kubestrata/blob/main/CHANGELOG.md).

          Verify an archive before use:

          ```sh
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github.com/kubestrata/kubestrata/.github/workflows/release.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          sha256sum -c --ignore-missing checksums.txt
          ```
          EOF

      # Pushes Formula/kubestrata.rb to kubestrata/homebrew-tap with a deploy key
      # that can write only to that repository.
      - name: update Homebrew tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          case "$version" in *-*) echo "pre-release $version: tap not updated"; exit 0 ;; esac
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set; run scripts/homebrew-formula.sh and update the tap by hand"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          git clone -q git@github.com:kubestrata/homebrew-tap.git "$RUNNER_TEMP/tap"
          sh scripts/homebrew-formula.sh "$version" dist/checksums.txt > "$RUNNER_TEMP/tap/Formula/kubestrata.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kubestrata.rb
          if git diff --cached --quiet; then echo "formula unchanged"; rm -f "$key"; exit 0; fi
          git commit -qm "feat: kubestrata ${version}"
          git push -q origin main
          rm -f "$key"

  # Wheels for PyPI, one per platform, each with the binary of the signed archive (no Python
  # code). Trusted Publishing: no token is stored; PyPI trusts this workflow and environment.
  # A pre-release tag (vX.Y.Z-rc.N) goes to TestPyPI only, a final tag to PyPI.
  pypi:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ contains(github.ref_name, '-') && 'testpypi' || 'pypi' }}
      url: ${{ contains(github.ref_name, '-') && 'https://test.pypi.org/project/kubestrata/' || 'https://pypi.org/project/kubestrata/' }}
    permissions:
      contents: read # download the release assets
      id-token: write # Trusted Publishing (OIDC) and PEP 740 attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: download and verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern 'kubestrata_*.tar.gz' --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cosign verify-blob --bundle rel/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com rel/checksums.txt

      - name: build wheels
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 scripts/build-wheels.py "$TAG" rel wheels

      - name: publish to TestPyPI
        if: contains(github.ref_name, '-')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels
          repository-url: https://test.pypi.org/legacy/

      - name: publish to PyPI
        if: ${{ !contains(github.ref_name, '-') }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels

  # A release created with GITHUB_TOKEN emits no `release` event to other workflows, but a
  # workflow_dispatch does: start install-smoke.yml for this tag once the tap and PyPI are updated.
  install-smoke:
    needs: [release, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatch install-smoke.yml
    steps:
      - name: dispatch install-smoke
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run install-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$TAG"
