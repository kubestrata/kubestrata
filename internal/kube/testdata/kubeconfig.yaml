# Fictitious kubeconfig for tests. No real endpoints or credentials.
apiVersion: v1
kind: Config
current-context: lab-origin
clusters:
  - name: origin
    cluster:
      server: https://127.0.0.1:6443
      insecure-skip-tls-verify: true
  - name: target
    cluster:
      server: https://ABCDEF.gr7.us-east-1.eks.amazonaws.com
contexts:
  - name: lab-origin
    context:
      cluster: origin
      user: origin-admin
      namespace: payments
  - name: eks-target
    context:
      cluster: target
      user: eks-user
  - name: dangling
    context:
      cluster: missing
      user: missing
users:
  - name: origin-admin
    user:
      token: fake-token-must-never-appear
  - name: eks-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: /opt/homebrew/bin/aws
        args: ["eks", "get-token", "--cluster-name", "target"]
