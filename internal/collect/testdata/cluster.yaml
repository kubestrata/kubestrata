# Karpenter / EKS Auto Mode. Terraform created the NodePool; Auto Mode wrote defaults into it in
# the same second (listed first). The status values must not reach the facts.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-purpose
  uid: np-general
  creationTimestamp: "2026-11-10T00:00:00Z"
  managedFields:
    - {manager: eks-auto-mode, operation: Update, time: "2026-11-10T00:00:00Z"}
    - {manager: HashiCorp, operation: Update, time: "2026-11-10T00:00:00Z"}
spec:
  weight: 10
  limits: {cpu: 1000, memory: 1000Gi}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets: [{nodes: "10%"}, {nodes: "0", reasons: [Drifted, Underutilized], schedule: "0 9 * * mon-fri", duration: 8h}]
  template:
    spec:
      expireAfter: 336h
      nodeClassRef: {group: eks.amazonaws.com, kind: NodeClass, name: default}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
        - {key: eks.amazonaws.com/instance-category, operator: In, values: [m, c]}
        - {key: kubernetes.io/arch, operator: Exists}
status: {resources: {cpu: "STATUS-4"}, nodes: 2}
---
